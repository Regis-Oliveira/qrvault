    <!-- Structured data — WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "QRVault",
        "url": "https://qrvault.app/",
        "publisher": {
          "@type": "Organization",
          "name": "ROC Desenvolvimento de Software Ltda",
          "url": "https://qrvault.app/"
        },
        "description": "Free online QR code generator. Create custom QR codes with colors, logo, dot styles and error correction — privately in your browser with no uploads and no servers.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Generate QR codes for URLs, text, email, and WiFi",
          "Custom dot styles and corner styles",
          "Custom foreground and background colors",
          "Embed your logo in the QR code",
          "Adjustable error correction levels (L, M, Q, H)",
          "Download as PNG, SVG, or JPG",
          "100% private — no uploads, no servers",
          "Works offline after page load"
        ]
      }
    </script>

    <!-- Structured data — FAQPage for Google rich snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is my data private? Does anything get uploaded?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nothing ever leaves your device. QRVault generates QR codes entirely in your browser using JavaScript — there are no servers, no uploads, and no tracking. Your URLs, WiFi passwords, and email addresses stay on your machine."
            }
          },
          {
            "@type": "Question",
            "name": "What content types can I encode in a QR code?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "QRVault supports four types: URL (any web address), plain text (notes, coupons, product codes), email (pre-filled address, subject and body), and WiFi (SSID, password and security type — scan to connect instantly on iOS and Android)."
            }
          },
          {
            "@type": "Question",
            "name": "What is error correction and which level should I use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Error correction lets a QR code be read even when part of it is damaged or obscured. Level L recovers 7% damage, M recovers 15%, Q recovers 25%, and H recovers 30%. Use H when embedding a logo. Use L or M for clean prints where you want smaller, denser patterns."
            }
          },
          {
            "@type": "Question",
            "name": "Why is my QR code not scanning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Common causes: the dot and background colors have too little contrast, the QR code is too small (print at least 2.5 cm / 1 inch), the error correction level is too low when a logo covers the centre, or the content is too long (keep URLs short using a URL shortener)."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between PNG, SVG, and JPG export?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "PNG is the safest choice — lossless, transparent background support, works everywhere. SVG is a vector format that scales infinitely for print. JPG uses lossy compression which can blur the sharp edges QR scanners rely on — use PNG or SVG instead whenever possible."
            }
          },
          {
            "@type": "Question",
            "name": "Can I add a logo? Any tips for good results?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — upload a PNG or SVG logo using the Upload logo button. Keep the file under 200 KB. Set the error correction level to H before adding a logo, because the logo covers part of the code and the higher correction level ensures it still scans correctly."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use QRVault offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Once the page has loaded in your browser, QRVault works completely offline — no internet connection required. All processing is local, so you can generate and download QR codes without any network access."
            }
          }
        ]
      }
    </script>

    <title>QRVault — Free Custom QR Code Generator</title>
